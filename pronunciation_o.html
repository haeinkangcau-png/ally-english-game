<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>O 발음 연습 🔊</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; padding: 24px 16px 48px;
    font-family: "Segoe UI", "Malgun Gothic", system-ui, sans-serif;
    background: linear-gradient(180deg, #fff6e9 0%, #ffeede 100%);
    color: #3c3028; min-height: 100vh;
  }
  h1 { text-align: center; font-size: 1.9rem; margin: 8px 0 4px; }
  .sub { text-align: center; color: #a08a78; margin: 0 0 24px; font-size: 1rem; }
  .accent-o { color: #e86a6a; }

  .grid {
    display: grid; gap: 16px; max-width: 640px; margin: 0 auto;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  }
  .card {
    background: #fff; border-radius: 24px; padding: 22px 16px 18px;
    text-align: center; cursor: pointer; user-select: none;
    box-shadow: 0 6px 0 0 #f2ddd0; border: 2px solid #fbe8de;
    transition: transform .1s, box-shadow .1s;
  }
  .card:active { transform: translateY(4px); box-shadow: 0 2px 0 0 #f2ddd0; }
  .card.playing { border-color: #e86a6a; box-shadow: 0 6px 0 0 #e86a6a; }
  .emoji { font-size: 4.2rem; line-height: 1; }
  .word  { font-size: 1.9rem; font-weight: 800; margin: 8px 0 2px; letter-spacing: .5px; }
  .word .accent-o { color: #e86a6a; }
  .pron  { color: #9a8272; font-size: 1rem; margin-bottom: 2px; }
  .kr    { color: #e86a6a; font-weight: 700; font-size: 1.05rem; }
  .spk   { margin-top: 10px; font-size: 1.3rem; opacity: .7; }

  .hint { text-align: center; color: #b5a091; font-size: .85rem; margin-top: 28px; line-height: 1.6; }
</style>
</head>
<body>
  <h1><span class="accent-o">O</span> 발음 연습 🔊</h1>
  <p class="sub">단어 카드를 누르면 미국 원어민 발음이 나와요</p>

  <div class="grid" id="grid"></div>

  <p class="hint">
    소리가 안 나면 카드를 한 번 더 눌러 주세요.<br>
    인터넷 연결이 없으면 자동으로 브라우저 발음으로 재생돼요.
  </p>

<script>
  // audio: 미국 원어민 녹음 (기본 구글 옥스포드 US, otter는 메리엄웹스터 US)
  const G = w => "https://ssl.gstatic.com/dictionary/static/sounds/oxford/" + w + "--_us_1.mp3";
  const WORDS = [
    { word: "octagon", pron: "/ˈɑːktəɡən/", kr: "팔각형", emoji: "🛑", audio: G("octagon") },
    { word: "ostrich", pron: "/ˈɑːstrɪtʃ/", kr: "타조",   emoji: "🐦", audio: G("ostrich") },
    { word: "ox",      pron: "/ɑːks/",       kr: "황소",   emoji: "🐂", audio: G("ox") },
    { word: "otter",   pron: "/ˈɑːt̬ər/",     kr: "수달",   emoji: "🦦", audio: "https://media.merriam-webster.com/audio/prons/en/us/mp3/o/otter001.mp3" },
    { word: "october", pron: "/ɑːkˈtoʊbər/", kr: "10월",   emoji: "🍂", audio: G("october") },
  ];

  // 첫 글자 O를 강조
  function hi(w) {
    return '<span class="accent-o">' + w[0] + '</span>' + w.slice(1);
  }

  function speakFallback(word) {
    if (!("speechSynthesis" in window)) return;
    const u = new SpeechSynthesisUtterance(word);
    u.lang = "en-US";
    u.rate = 0.85;
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
  }

  let current = null;
  function play(w, cardEl) {
    if (current) { current.pause(); current = null; }
    document.querySelectorAll(".card").forEach(c => c.classList.remove("playing"));
    cardEl.classList.add("playing");

    const a = new Audio(w.audio);
    current = a;
    let fellBack = false;
    a.play().catch(() => { fellBack = true; speakFallback(w.word); });
    a.onerror = () => { if (!fellBack) { fellBack = true; speakFallback(w.word); } };
    a.onended = () => cardEl.classList.remove("playing");
    setTimeout(() => cardEl.classList.remove("playing"), 3000);
  }

  const grid = document.getElementById("grid");
  WORDS.forEach(w => {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML =
      '<div class="emoji">' + w.emoji + '</div>' +
      '<div class="word">' + hi(w.word) + '</div>' +
      '<div class="pron">' + w.pron + '</div>' +
      '<div class="kr">' + w.kr + '</div>' +
      '<div class="spk">🔊</div>';
    card.addEventListener("click", () => play(w, card));
    grid.appendChild(card);
  });
</script>
</body>
</html>
